name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d. -f1)
          echo "Detected Java Major Version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java 17 or newer is required. Found Java version: $JAVA_VER"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f ./debug.keystore ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK file not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk for any APKs:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty."
            exit 1
          fi

          case "$APK_PATH" in
            *.apk) ;;
            *) echo "Error: $APK_PATH does not have .apk extension"; exit 1 ;;
          esac

          echo "APK verification passed: $APK_PATH ($(ls -lh "$APK_PATH" | awk '{print $5}'))"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/app-debug.apk"

          if [ ! -s "$TEMP_DIR/app-debug.apk" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          cat << 'EOF' > "$TEMP_DIR/release_notes.md"
### Idiom AI Debug APK
- This is an automatically generated debug APK.
- The APK was built by GitHub Actions.
- GitHub Actions run number: #${{ github.run_number }}
- GitHub Actions run attempt: #${{ github.run_attempt }}
- Source commit SHA: ${{ github.sha }}
- APK is intended for testing.
- APK is not a Play Store production release.
- APK is signed only with a temporary debug keystore.
EOF

          echo "asset_path=$TEMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "notes_path=$TEMP_DIR/release_notes.md" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TEMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          NOTES_PATH="${{ steps.prepare_asset.outputs.notes_path }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset $ASSET_PATH does not exist or is empty."
            exit 1
          fi

          FILENAME=$(basename "$ASSET_PATH")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be app-debug.apk, got $FILENAME"
            exit 1
          fi

          echo "Creating GitHub Release: $RELEASE_TAG ($RELEASE_TITLE)"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes-file "$NOTES_PATH" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================="
            echo "GitHub Release published successfully!"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"
            echo "=========================================="

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the latest debug APK directly:" >> "$GITHUB_STEP_SUMMARY"
            echo "**[$DIRECT_URL]($DIRECT_URL)**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*Actions artifact \`app-debug-apk\` remains available as a backup.*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            echo "The debug APK was built successfully and is preserved as GitHub Actions artifact: app-debug-apk"
            echo "### Build Status" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub Release publishing did not complete, but the debug APK was built and uploaded as the Actions artifact **app-debug-apk**." >> "$GITHUB_STEP_SUMMARY"
          fi
